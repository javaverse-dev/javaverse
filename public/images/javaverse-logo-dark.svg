<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="Javaverse">
  <title>Javaverse</title>
  <defs>
    <linearGradient id="jvl-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
<svg x="0" y="0" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="jv-glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jv-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <clipPath id="jv-tile">
      <rect width="64" height="64" rx="16"/>
    </clipPath>
    <clipPath id="jv-front">
      <rect x="0" y="42" width="64" height="22"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="url(#jv-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#jv-glow)"/>

  <!-- background: code -->
  <g clip-path="url(#jv-tile)" fill="#ffffff">
    <g fill-opacity="0.22">
      <rect x="7"  y="8"  width="9" height="2" rx="1"/>
      <rect x="18" y="8"  width="4" height="2" rx="1"/>
      <rect x="10" y="12.5" width="7" height="2" rx="1"/>
      <rect x="10" y="17" width="10" height="2" rx="1"/>
      <rect x="7"  y="21.5" width="4" height="2" rx="1"/>
      <rect x="44" y="58" width="9" height="2" rx="1"/>
      <rect x="8"  y="58" width="6" height="2" rx="1"/>
    </g>
    <text x="2.5" y="45" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace"
          font-size="20" font-weight="700" fill-opacity="0.2">{</text>
    <text x="61.5" y="45" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace"
          font-size="20" font-weight="700" fill-opacity="0.2">}</text>
  </g>

  <!-- orbit (back half) -->
  <ellipse cx="32" cy="42" rx="27" ry="7" transform="rotate(-14 32 42)"
           fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6"/>

  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.95">
    <path d="M25.5 27.5 c-3 -3 3 -5 0 -9"/>
    <path d="M31.5 28 c-3 -4 3 -6.5 0 -11.5"/>
    <path d="M37.5 27.5 c-3 -3 3 -5 0 -9"/>
  </g>

  <!-- cup -->
  <path d="M44 34.5 h2.2 a5 5 0 0 1 0 10 H43" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 31 H44 V39 c0 7 -5.5 12 -13 12 s-13 -5 -13 -12 Z" fill="url(#jv-cup)"/>
  <rect x="14" y="52.5" width="34" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>

  <!-- </> on the cup -->
  <g fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 37 l-3.2 3.2 3.2 3.2"/>
    <path d="M32.6 35.6 l-3.2 9"/>
    <path d="M36 37 l3.2 3.2 -3.2 3.2"/>
  </g>

  <!-- orbit (front half) -->
  <g clip-path="url(#jv-front)">
    <ellipse cx="32" cy="42" rx="27" ry="7" transform="rotate(-14 32 42)"
             fill="none" stroke="#ffffff" stroke-width="1.8"/>
  </g>

  <!-- planet + sparkle -->
  <circle cx="58" cy="35.6" r="2.8" fill="#fef3c7"/>
  <path d="M53 9 l1.1 2.7 2.7 1.1 -2.7 1.1 -1.1 2.7 -1.1 -2.7 -2.7 -1.1 2.7 -1.1z" fill="#ffffff" fill-opacity="0.9"/>
</svg>


  <text x="80" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#ffffff">Java</tspan><tspan fill="url(#jvl-text)">verse</tspan>
  </text>
</svg>


