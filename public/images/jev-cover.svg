<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Unstructured AI output flows through the Jev decision model and comes out as type-safe Java decisions">
    <title>Type-safe AI decisions with Jev</title>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b1120"/>
            <stop offset="0.55" stop-color="#111827"/>
            <stop offset="1" stop-color="#1e1b4b"/>
        </linearGradient>
        <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
        </pattern>
        <radialGradient id="aiGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gateGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34d399"/>
            <stop offset="0.5" stop-color="#0d9488"/>
            <stop offset="1" stop-color="#4338ca"/>
        </linearGradient>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6ee7b7"/>
            <stop offset="1" stop-color="#a5b4fc"/>
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
        </marker>
    </defs>

    <!-- background -->
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#dots)"/>

    <!-- heading -->
    <text x="60" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700"
          letter-spacing="3" fill="#34d399">JAVAVERSE · AI ON THE JVM</text>
    <text x="60" y="110" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800"
          fill="#f8fafc">Type-safe AI decisions with <tspan fill="url(#brand)">Jev</tspan></text>

    <!-- ============ LEFT: probabilistic AI model ============ -->
    <circle cx="160" cy="315" r="150" fill="url(#aiGlow)"/>
    <g stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="1.5">
        <!-- layer 1 -> layer 2 -->
        <path d="M90 245 L160 210 M90 245 L160 280 M90 245 L160 350 M90 245 L160 420"/>
        <path d="M90 315 L160 210 M90 315 L160 280 M90 315 L160 350 M90 315 L160 420"/>
        <path d="M90 385 L160 210 M90 385 L160 280 M90 385 L160 350 M90 385 L160 420"/>
        <!-- layer 2 -> layer 3 -->
        <path d="M160 210 L230 245 M160 210 L230 315 M160 210 L230 385"/>
        <path d="M160 280 L230 245 M160 280 L230 315 M160 280 L230 385"/>
        <path d="M160 350 L230 245 M160 350 L230 315 M160 350 L230 385"/>
        <path d="M160 420 L230 245 M160 420 L230 315 M160 420 L230 385"/>
    </g>
    <g fill="#1e1b4b" stroke="#a5b4fc" stroke-width="3">
        <circle cx="90" cy="245" r="11"/><circle cx="90" cy="315" r="11"/><circle cx="90" cy="385" r="11"/>
        <circle cx="160" cy="210" r="11"/><circle cx="160" cy="280" r="11"/>
        <circle cx="160" cy="350" r="11"/><circle cx="160" cy="420" r="11"/>
        <circle cx="230" cy="245" r="11"/><circle cx="230" cy="315" r="11"/><circle cx="230" cy="385" r="11"/>
    </g>
    <g fill="#c7d2fe">
        <circle cx="160" cy="280" r="5"/><circle cx="230" cy="315" r="5"/><circle cx="90" cy="385" r="5"/>
    </g>
    <!-- sparkles -->
    <g fill="#ffffff">
        <path d="M60 185 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill-opacity="0.9"/>
        <path d="M262 440 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill-opacity="0.7"/>
        <path d="M250 175 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill-opacity="0.6"/>
    </g>
    <text x="160" y="482" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
          font-size="20" font-weight="700" fill="#e0e7ff">AI model</text>
    <text x="160" y="505" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace"
          font-size="13" fill="#94a3b8">probabilistic output</text>

    <!-- fuzzy, untyped outputs -->
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15">
        <g transform="translate(298 212) rotate(-6)">
            <rect width="172" height="40" rx="10" fill="#f59e0b" fill-opacity="0.08"
                  stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
            <text x="14" y="26" fill="#fcd34d">"approve...?"</text>
        </g>
        <g transform="translate(308 296) rotate(4)">
            <rect width="172" height="40" rx="10" fill="#f59e0b" fill-opacity="0.08"
                  stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
            <text x="14" y="26" fill="#fcd34d">{score:"0.7?"}</text>
        </g>
        <g transform="translate(296 384) rotate(-3)">
            <rect width="172" height="40" rx="10" fill="#f87171" fill-opacity="0.08"
                  stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
            <text x="14" y="26" fill="#fca5a5">"maybe reject"</text>
        </g>
    </g>
    <!-- flows into the gate -->
    <g fill="none" stroke="#fcd34d" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round">
        <path d="M472 222 C505 230 505 290 528 305"/>
        <path d="M482 322 C500 320 510 316 528 315"/>
        <path d="M466 400 C505 395 505 340 528 325"/>
    </g>

    <!-- ============ CENTER: Jev decision gate ============ -->
    <circle cx="600" cy="305" r="170" fill="url(#gateGlow)"/>
    <path d="M600 185 L680 215 V300 c0 60 -35 100 -80 125 c-45 -25 -80 -65 -80 -125 V215 Z"
          fill="url(#shield)" stroke="#a7f3d0" stroke-opacity="0.6" stroke-width="2"/>
    <!-- decision tree inside shield -->
    <path d="M600 222 l17 17 -17 17 -17 -17z" fill="#ffffff"/>
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M600 256 V274 M565 294 V274 H635 V294 M600 274 V294"/>
    </g>
    <g fill="#ffffff">
        <rect x="553" y="294" width="24" height="20" rx="5"/>
        <rect x="588" y="294" width="24" height="20" rx="5"/>
        <rect x="623" y="294" width="24" height="20" rx="5"/>
    </g>
    <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M559 304 l4 4 8 -8" stroke="#059669"/>
        <path d="M595 299 l10 10 M605 299 l-10 10" stroke="#dc2626"/>
        <path d="M629 304 h12" stroke="#d97706"/>
    </g>
    <text x="600" y="368" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace"
          font-size="30" font-weight="800" fill="#ffffff">&lt;T&gt;</text>
    <text x="600" y="472" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
          font-size="34" font-weight="800" fill="url(#brand)">Jev</text>
    <text x="600" y="497" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace"
          font-size="13" fill="#94a3b8">decision model</text>

    <!-- output arrow -->
    <path d="M688 315 H750" stroke="#34d399" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- ============ RIGHT: typed Java result ============ -->
    <rect x="762" y="150" width="400" height="320" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M762 166 a16 16 0 0 1 16 -16 h368 a16 16 0 0 1 16 16 v26 h-400 z" fill="#1e293b"/>
    <circle cx="786" cy="171" r="6" fill="#f87171"/>
    <circle cx="806" cy="171" r="6" fill="#fbbf24"/>
    <circle cx="826" cy="171" r="6" fill="#34d399"/>
    <text x="850" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#94a3b8">Decision.java</text>

    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#e2e8f0" xml:space="preserve">
    <text x="784" y="226"><tspan fill="#c084fc">sealed interface</tspan> <tspan fill="#6ee7b7">Decision</tspan></text>
        <text x="784" y="250">    <tspan fill="#c084fc">permits</tspan> Approve, Reject, Review {}</text>
        <text x="784" y="290"><tspan fill="#c084fc">record</tspan> <tspan fill="#6ee7b7">Approve</tspan>(<tspan fill="#93c5fd">String</tspan> reason)</text>
        <text x="784" y="314">    <tspan fill="#c084fc">implements</tspan> Decision {}</text>
        <text x="784" y="346"><tspan fill="#c084fc">record</tspan> <tspan fill="#6ee7b7">Reject</tspan>(<tspan fill="#93c5fd">String</tspan> reason)</text>
        <text x="784" y="370">    <tspan fill="#c084fc">implements</tspan> Decision {}</text>
        <text x="784" y="402"><tspan fill="#c084fc">record</tspan> <tspan fill="#6ee7b7">Review</tspan>(<tspan fill="#93c5fd">String</tspan> question)</text>
        <text x="784" y="426">    <tspan fill="#c084fc">implements</tspan> Decision {}</text>
  </g>

    <!-- typed outcomes -->
    <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700">
        <rect x="762" y="492" width="124" height="38" rx="19" fill="#059669" fill-opacity="0.18" stroke="#34d399"/>
        <path d="M782 511 l5 5 9 -10" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="804" y="517" fill="#a7f3d0">Approve</text>

        <rect x="900" y="492" width="124" height="38" rx="19" fill="#dc2626" fill-opacity="0.18" stroke="#f87171"/>
        <path d="M922 505 l12 12 M934 505 l-12 12" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
        <text x="944" y="517" fill="#fecaca">Reject</text>

        <rect x="1038" y="492" width="124" height="38" rx="19" fill="#d97706" fill-opacity="0.18" stroke="#fbbf24"/>
        <path d="M1058 511 h14" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
        <text x="1080" y="517" fill="#fde68a">Review</text>
    </g>

    <!-- tagline -->
    <text x="600" y="592" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
          font-size="18" fill="#94a3b8">Unstructured AI output  →  <tspan fill="#6ee7b7" font-weight="700">Jev</tspan>  →  compile-time checked Java decisions</text>
</svg>