<section class="contact">
  <ul>
    {#for entry in brand.entrySet()}
    {#if site.data.get(entry.key)??}
    <li>
      <a href="{=entry.value.prefix()}{=site.data.get(entry.key)}" target="_blank" rel="noopener noreferrer" aria-label="{=entry.key}">
        <i class="{=entry.value.icon()}" aria-hidden="true"></i>
      </a>
    </li>
    {/if}
    {/for}
  </ul>
</section>
