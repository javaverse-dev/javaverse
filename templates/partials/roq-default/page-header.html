{#if page.data('show-header', true)}
<section class="page-header">
  <h1 class="page-title">{=page.title}</h1>
  {#if page.data('show-header-date', true) && page.date}
  <div class="page-header-date"><span>{=page.date.format('MMM d, yyyy')}{#if page.readTime??} · {=page.readTime} min read{/if}</span></div>
  {/if}
  {#if page.data('show-header-intro', true) && page.description}
  <p class="page-header-intro">
    {=page.description}
  </p>
  {/if}
</section>
{/if}
